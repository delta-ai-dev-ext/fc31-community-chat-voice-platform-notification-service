- id: members
  label: Members
  kind: annotation
  role: inbound
  row: 588
  evidence:
  - path: docs/user_stories.md
    quote: '**Member**: an authenticated user with an access token issued by identity_service.'
  - path: docs/openapi_spec.yaml
    quote: In-app notification inbox and per-kind notification preferences for the
- id: svc
  name: notification_service
  label: Notification service
  kind: service
  technology: kubernetes-pod
  role: service
  row: 540
  evidence:
  - path: docs/architecture.md
    quote: '`notification_service` sends the moderation notice to the affected member.'
  - path: docs/architecture.md
    quote: 'Event-driven fan-in service: it consumes five domain-event contracts,
      turns them into member-facing notifications, and fans out live push events and
      transactional emails.'
- id: db
  label: Notification PostgreSQL
  kind: database
  technology: postgresql
  role: outbound
  row: 498
  evidence:
  - path: docs/architecture.md
    quote: All tables are owned and defined by this service.
  - path: docs/architecture.md
    quote: '**Throttling:** at most one mention email per recipient per 15-minute
      window; the window is persisted in PostgreSQL so it survives restarts.'
- id: resend
  label: Resend
  kind: annotation
  external: true
  external_role: dependency
  role: outbound
  row: 624
  evidence:
  - path: docs/architecture.md
    quote: Send notification emails via Resend according to per-user preferences,
      only to verified emails of active accounts
  - path: docs/architecture.md
    quote: Resend integration:** official SDK, idempotency key = notification id
relationships:
- id: r-caller
  source: members
  target: svc
  type: request
  interaction:
