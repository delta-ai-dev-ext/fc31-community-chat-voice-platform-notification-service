    exchange_id: member-notification-api
  evidence:
  - path: docs/architecture.md
    quote: REST API layer
  - path: docs/user_stories.md
    quote: '`GET /notifications` returns the caller''s notifications'
- id: r-db
  source: svc
  target: db
  type: ownership
  evidence:
  - path: docs/architecture.md
    quote: All tables are owned and defined by this service.
  - path: docs/architecture.md
    quote: '**Transactional outbox:** the notification insert and the outbox row commit
      together'
- id: r-resend
  source: svc
  target: resend
  type: request
  interaction:
    channel: direct
    purpose: notification email delivery
